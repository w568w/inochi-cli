name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            tests: 'ON'
            install: sudo apt-get update && sudo apt-get install -y libsdl2-dev libfreetype6-dev libgl1-mesa-dev libdbus-1-dev xvfb xauth ffmpeg
          - os: windows-2022
            platform: windows-x86_64
            tests: 'OFF'
            triplet: x64-windows
            cmake: -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/vcpkg-installed"
          - os: macos-15
            platform: macos-arm64
            tests: 'OFF'
            triplet: arm64-osx-dynamic
            cmake: -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-osx-dynamic -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/vcpkg-installed"
          - os: macos-15-intel
            platform: macos-x86_64
            tests: 'OFF'
            triplet: x64-osx-dynamic
            cmake: -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-osx-dynamic -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/vcpkg-installed"
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: ${{ matrix.install }}
      - uses: lukka/run-vcpkg@v11
        if: runner.os != 'Linux'
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
      - uses: actions/setup-python@v7
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Install test dependencies
        if: runner.os == 'Linux'
        run: python -m pip install Pillow psutil
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=${{ matrix.tests }} ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix "$PWD/stage"
      - name: Smoke test
        timeout-minutes: 1
        run: stage/bin/inochi capabilities --json > capabilities.json
      - name: Check macOS model loading
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: |
          stage/bin/inochi new project new -o smoke.inx
          stage/bin/inochi smoke.inx project check
      - name: Package
        run: cpack --config build/CPackConfig.cmake -G ZIP -B dist -D CPACK_PACKAGE_FILE_NAME=inochi-${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: inochi-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
